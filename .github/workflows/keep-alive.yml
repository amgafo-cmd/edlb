name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 00:00 UTC
    - cron: '0 0 */3 * *'
    workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si quieres probarlo

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta de actividad a Supabase
        run: |
          curl -X POST "${{secrets.SUPABASE_URL}}/rest/v1/rpc/keep_alive_ping" \
          -H "apikey: ${{secrets.SUPABASE_ANON_KEY}}" \
          -H "Authorization: Bearer ${{secrets.SUPABASE_ANON_KEY}}" \
          -H "Content-Type: application/json"
